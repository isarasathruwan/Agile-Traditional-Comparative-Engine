<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="400" viewBox="0 0 1400 400">
  <rect width="1400" height="400" fill="#f6f8fc"/>
  <text x="70" y="62" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Assessment journey</text>
  <text x="70" y="96" font-family="Arial, sans-serif" font-size="17" fill="#475569">The participant remains in control from project details to the final decision brief.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(70 145)">
      <rect width="215" height="155" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
      <circle cx="36" cy="35" r="20" fill="#1d4ed8"/><text x="36" y="42" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">1</text>
      <text x="25" y="82" font-size="20" font-weight="700" fill="#0f172a">Project context</text>
      <text x="25" y="111" font-size="15" fill="#475569">Who, what, duration,</text><text x="25" y="133" font-size="15" fill="#475569">team and budget</text>
    </g>
    <path d="M300 222 H338" stroke="#64748b" stroke-width="3"/><path d="M338 222 l-12 -8 v16 z" fill="#64748b"/>
    <g transform="translate(350 145)">
      <rect width="215" height="155" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
      <circle cx="36" cy="35" r="20" fill="#1d4ed8"/><text x="36" y="42" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">2</text>
      <text x="25" y="82" font-size="20" font-weight="700" fill="#0f172a">Optional evidence</text>
      <text x="25" y="111" font-size="15" fill="#475569">Consent and text-based</text><text x="25" y="133" font-size="15" fill="#475569">PDF documents</text>
    </g>
    <path d="M580 222 H618" stroke="#64748b" stroke-width="3"/><path d="M618 222 l-12 -8 v16 z" fill="#64748b"/>
    <g transform="translate(630 145)">
      <rect width="215" height="155" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
      <circle cx="36" cy="35" r="20" fill="#1d4ed8"/><text x="36" y="42" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">3</text>
      <text x="25" y="82" font-size="20" font-weight="700" fill="#0f172a">Method signals</text>
      <text x="25" y="111" font-size="15" fill="#475569">12 questions about</text><text x="25" y="133" font-size="15" fill="#475569">change, control and risk</text>
    </g>
    <path d="M860 222 H898" stroke="#64748b" stroke-width="3"/><path d="M898 222 l-12 -8 v16 z" fill="#64748b"/>
    <g transform="translate(910 145)">
      <rect width="180" height="155" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
      <circle cx="36" cy="35" r="20" fill="#1d4ed8"/><text x="36" y="42" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">4</text>
      <text x="25" y="82" font-size="20" font-weight="700" fill="#0f172a">Review</text>
      <text x="25" y="111" font-size="15" fill="#475569">Check and correct</text><text x="25" y="133" font-size="15" fill="#475569">every answer</text>
    </g>
    <path d="M1105 222 H1143" stroke="#64748b" stroke-width="3"/><path d="M1143 222 l-12 -8 v16 z" fill="#64748b"/>
    <g transform="translate(1155 145)">
      <rect width="180" height="155" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
      <circle cx="36" cy="35" r="20" fill="#059669"/><text x="36" y="42" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">5</text>
      <text x="25" y="82" font-size="20" font-weight="700" fill="#0f172a">Decision brief</text>
      <text x="25" y="111" font-size="15" fill="#475569">Fit, rationale, risks</text><text x="25" y="133" font-size="15" fill="#475569">and next steps</text>
    </g>
  </g>
  <text x="70" y="350" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">Important:</text>
  <text x="156" y="350" font-family="Arial, sans-serif" font-size="16" fill="#475569">documents are optional, and the participant must confirm eligible document evidence before it can influence the result.</text>
</svg>
