<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="610" viewBox="0 0 1400 610">
  <rect width="1400" height="610" fill="#f6f8fc"/>
  <text x="70" y="60" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">Document intelligence pipeline</text>
  <text x="70" y="94" font-family="Arial" font-size="17" fill="#475569">The worker is asynchronous: the questionnaire remains usable while a queued PDF job is processed.</text>
  <g font-family="Arial">
    <g transform="translate(65 155)"><rect width="170" height="130" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="85" y="43" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">1. Consent</text><text x="85" y="75" text-anchor="middle" font-size="14" fill="#475569">Participant accepts</text><text x="85" y="98" text-anchor="middle" font-size="14" fill="#475569">both statements</text></g>
    <path d="M245 220 H280" stroke="#64748b" stroke-width="3"/><path d="M280 220 l-12 -8 v16 z" fill="#64748b"/>
    <g transform="translate(290 155)"><rect width="170" height="130" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="85" y="43" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">2. Upload</text><text x="85" y="75" text-anchor="middle" font-size="14" fill="#475569">Validate PDF and</text><text x="85" y="98" text-anchor="middle" font-size="14" fill="#475569">encrypt original bytes</text></g>
    <path d="M470 220 H505" stroke="#64748b" stroke-width="3"/><path d="M505 220 l-12 -8 v16 z" fill="#64748b"/>
    <g transform="translate(515 155)"><rect width="170" height="130" rx="16" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/><text x="85" y="43" text-anchor="middle" font-size="18" font-weight="700" fill="#92400e">3. Queue</text><text x="85" y="75" text-anchor="middle" font-size="14" fill="#475569">Create processing job</text><text x="85" y="98" text-anchor="middle" font-size="14" fill="#475569">and lock file set</text></g>
    <path d="M695 220 H730" stroke="#64748b" stroke-width="3"/><path d="M730 220 l-12 -8 v16 z" fill="#64748b"/>
    <g transform="translate(740 155)"><rect width="190" height="130" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="95" y="43" text-anchor="middle" font-size="18" font-weight="700" fill="#065f46">4. Extract</text><text x="95" y="75" text-anchor="middle" font-size="14" fill="#475569">Decrypt, read pages,</text><text x="95" y="98" text-anchor="middle" font-size="14" fill="#475569">split into chunks</text></g>
    <path d="M940 220 H975" stroke="#64748b" stroke-width="3"/><path d="M975 220 l-12 -8 v16 z" fill="#64748b"/>
    <g transform="translate(985 155)"><rect width="170" height="130" rx="16" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="85" y="43" text-anchor="middle" font-size="18" font-weight="700" fill="#5b21b6">5. Embed</text><text x="85" y="75" text-anchor="middle" font-size="14" fill="#475569">Gemini vectors</text><text x="85" y="98" text-anchor="middle" font-size="14" fill="#475569">stored in pgvector</text></g>
    <path d="M1165 220 H1200" stroke="#64748b" stroke-width="3"/><path d="M1200 220 l-12 -8 v16 z" fill="#64748b"/>
    <g transform="translate(1210 155)"><rect width="150" height="130" rx="16" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="75" y="43" text-anchor="middle" font-size="18" font-weight="700" fill="#5b21b6">6. Reason</text><text x="75" y="75" text-anchor="middle" font-size="14" fill="#475569">Retrieve chunks</text><text x="75" y="98" text-anchor="middle" font-size="14" fill="#475569">and propose facts</text></g>
    <path d="M1285 300 V355 H875" fill="none" stroke="#64748b" stroke-width="3"/><path d="M875 355 l12 -8 v16 z" fill="#64748b"/>
    <g transform="translate(700 385)"><rect width="350" height="120" rx="16" fill="#fff" stroke="#3b82f6" stroke-width="2"/><text x="175" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#1e3a8a">7. Participant review</text><text x="175" y="73" text-anchor="middle" font-size="15" fill="#475569">Show citation, page and excerpt</text><text x="175" y="98" text-anchor="middle" font-size="15" fill="#475569">Confirm or omit; no free score edit</text></g>
    <path d="M690 445 H570" stroke="#64748b" stroke-width="3"/><path d="M570 445 l12 -8 v16 z" fill="#64748b"/>
    <g transform="translate(220 385)"><rect width="350" height="120" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="175" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#065f46">8. Bounded contribution</text><text x="175" y="73" text-anchor="middle" font-size="15" fill="#475569">Confirmed cited evidence only</text><text x="175" y="98" text-anchor="middle" font-size="15" fill="#475569">Maximum 25% of each construct</text></g>
  </g>
</svg>
