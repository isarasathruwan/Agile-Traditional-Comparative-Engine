<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600">
  <rect width="1400" height="600" fill="#f6f8fc"/>
  <text x="70" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">How the local application is connected</text>
  <text x="70" y="94" font-family="Arial, sans-serif" font-size="17" fill="#475569">Docker Desktop runs five cooperating services. Gemini is an external service used only by the optional document features.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(70 180)"><rect width="210" height="135" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="105" y="48" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Web browser</text><text x="105" y="79" text-anchor="middle" font-size="15" fill="#475569">Participant and admin</text><text x="105" y="103" text-anchor="middle" font-size="15" fill="#475569">screens</text></g>
    <path d="M295 248 H365" stroke="#64748b" stroke-width="3"/><path d="M365 248 l-12 -8 v16 z" fill="#64748b"/>
    <g transform="translate(380 180)"><rect width="230" height="135" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="115" y="48" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Frontend</text><text x="115" y="79" text-anchor="middle" font-size="15" fill="#475569">Next.js · port 3000</text><text x="115" y="103" text-anchor="middle" font-size="15" fill="#475569">Displays the interface</text></g>
    <path d="M625 248 H695" stroke="#64748b" stroke-width="3"/><path d="M695 248 l-12 -8 v16 z" fill="#64748b"/>
    <g transform="translate(710 180)"><rect width="230" height="135" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="115" y="48" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Backend API</text><text x="115" y="79" text-anchor="middle" font-size="15" fill="#475569">FastAPI · port 8000</text><text x="115" y="103" text-anchor="middle" font-size="15" fill="#475569">Rules, access and data</text></g>
    <path d="M955 248 H1025" stroke="#64748b" stroke-width="3"/><path d="M1025 248 l-12 -8 v16 z" fill="#64748b"/>
    <g transform="translate(1040 180)"><rect width="290" height="135" rx="18" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/><text x="145" y="48" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Database</text><text x="145" y="79" text-anchor="middle" font-size="15" fill="#475569">PostgreSQL 16 + pgvector</text><text x="145" y="103" text-anchor="middle" font-size="15" fill="#475569">Results, versions and evidence</text></g>
    <path d="M825 330 V390 H500" fill="none" stroke="#64748b" stroke-width="3"/><path d="M500 390 l12 -8 v16 z" fill="#64748b"/>
    <g transform="translate(210 405)"><rect width="290" height="125" rx="18" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/><text x="145" y="45" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Document worker</text><text x="145" y="75" text-anchor="middle" font-size="15" fill="#475569">Extracts text, creates embeddings</text><text x="145" y="99" text-anchor="middle" font-size="15" fill="#475569">and finds cited evidence</text></g>
    <path d="M825 330 V390 H900" fill="none" stroke="#64748b" stroke-width="3"/><path d="M900 390 l-12 -8 v16 z" fill="#64748b"/>
    <g transform="translate(900 405)"><rect width="290" height="125" rx="18" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/><text x="145" y="45" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Traditional advisor worker</text><text x="145" y="75" text-anchor="middle" font-size="15" fill="#475569">Creates Traditional delivery</text><text x="145" y="99" text-anchor="middle" font-size="15" fill="#475569">sub-method advice</text></g>
    <path d="M500 468 H650" stroke="#8b5cf6" stroke-width="3"/><path d="M900 468 H750" stroke="#8b5cf6" stroke-width="3"/>
    <g transform="translate(650 420)"><rect width="100" height="96" rx="48" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/><text x="50" y="43" text-anchor="middle" font-size="17" font-weight="700" fill="#5b21b6">Gemini</text><text x="50" y="66" text-anchor="middle" font-size="13" fill="#6d28d9">external</text></g>
  </g>
</svg>
