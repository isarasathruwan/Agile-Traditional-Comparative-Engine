    <text x="542" y="458" text-anchor="middle" font-size="18" font-weight="700" fill="#065f46">assessment_submissions</text><text x="542" y="483" text-anchor="middle" font-size="14" fill="#475569">project profile</text>
    <g fill="#fff7ed" stroke="#f59e0b" stroke-width="2"><rect x="780" y="130" width="250" height="80" rx="14"/><rect x="780" y="260" width="250" height="80" rx="14"/><rect x="780" y="390" width="250" height="80" rx="14"/><rect x="780" y="520" width="250" height="80" rx="14"/></g>
