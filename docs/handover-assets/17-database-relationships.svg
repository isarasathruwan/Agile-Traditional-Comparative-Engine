    <text x="190" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">questionnaire_versions</text><text x="190" y="202" text-anchor="middle" font-size="14" fill="#475569">active/versioned JSON</text>
    <text x="190" y="318" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">rule_config_versions</text><text x="190" y="342" text-anchor="middle" font-size="14" fill="#475569">weights and profiles</text>
