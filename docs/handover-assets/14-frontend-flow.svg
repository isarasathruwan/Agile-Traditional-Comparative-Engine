<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650">
  <rect width="1400" height="650" fill="#f6f8fc"/>
  <text x="70" y="60" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">Frontend assessment flow</text>
  <text x="70" y="94" font-family="Arial" font-size="17" fill="#475569">frontend/app/page.tsx owns the journey state and selects the component for the current screen.</text>
  <g font-family="Arial">
    <rect x="70" y="145" width="250" height="120" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="195" y="192" text-anchor="middle" font-size="22" font-weight="700" fill="#1e3a8a">Home component</text>
    <text x="195" y="224" text-anchor="middle" font-size="15" fill="#475569">State, screen number, answers</text>
    <path d="M335 205 H420" stroke="#64748b" stroke-width="3"/><path d="M420 205 l-12 -8 v16 z" fill="#64748b"/>
    <rect x="435" y="145" width="260" height="120" rx="18" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
    <text x="565" y="192" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Current screen</text>
    <text x="565" y="224" text-anchor="middle" font-size="15" fill="#475569">Derived from questionnaire length</text>
    <path d="M710 205 H795" stroke="#64748b" stroke-width="3"/><path d="M795 205 l-12 -8 v16 z" fill="#64748b"/>
    <rect x="810" y="145" width="520" height="120" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="1070" y="185" text-anchor="middle" font-size="22" font-weight="700" fill="#065f46">Reusable screen component</text>
    <text x="1070" y="218" text-anchor="middle" font-size="15" fill="#475569">TextQuestion · PillSelectQuestion · DocumentUploadScreen</text>
    <text x="1070" y="241" text-anchor="middle" font-size="15" fill="#475569">LikertScreen · AssessmentReview · ResultWorkspace</text>
    <path d="M1070 280 V340 H195 V280" fill="none" stroke="#1d4ed8" stroke-width="3"/><path d="M195 280 l-8 12 h16 z" fill="#1d4ed8"/>
    <text x="610" y="330" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">User action updates state and advances or returns to review</text>
    <rect x="150" y="405" width="340" height="130" rx="18" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="320" y="452" text-anchor="middle" font-size="21" font-weight="700" fill="#5b21b6">frontend/lib/api.ts</text>
    <text x="320" y="484" text-anchor="middle" font-size="15" fill="#475569">Turns state into HTTP requests</text>
    <text x="320" y="509" text-anchor="middle" font-size="15" fill="#475569">and typed responses</text>
    <path d="M505 470 H600" stroke="#64748b" stroke-width="3"/><path d="M600 470 l-12 -8 v16 z" fill="#64748b"/>
    <rect x="615" y="405" width="300" height="130" rx="18" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
    <text x="765" y="452" text-anchor="middle" font-size="21" font-weight="700" fill="#92400e">Backend API</text>
    <text x="765" y="484" text-anchor="middle" font-size="15" fill="#475569">Validates, calculates, stores</text>
    <text x="765" y="509" text-anchor="middle" font-size="15" fill="#475569">and returns JSON</text>
    <path d="M930 470 H1025" stroke="#64748b" stroke-width="3"/><path d="M1025 470 l-12 -8 v16 z" fill="#64748b"/>
    <rect x="1040" y="405" width="290" height="130" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="1185" y="452" text-anchor="middle" font-size="21" font-weight="700" fill="#065f46">ResultWorkspace</text>
    <text x="1185" y="484" text-anchor="middle" font-size="15" fill="#475569">Decision · Plan · Evidence</text>
    <text x="1185" y="509" text-anchor="middle" font-size="15" fill="#475569">Analysis</text>
  </g>
</svg>
