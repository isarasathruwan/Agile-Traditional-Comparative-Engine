services:
  db:
    image: pgvector/pgvector:pg16
    container_name: methodalign-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: methodalign
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d methodalign"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - methodalign-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: methodalign-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      APP_NAME: "MethodAlign IS API"
      APP_ENV: production
      APP_PORT: 8000
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: methodalign
      POSTGRES_DRIVER: psycopg
      JWT_SECRET: ${JWT_SECRET:-change-me-please-change-me}
      JWT_ALGORITHM: HS256
      JWT_EXP_MINUTES: 480
      AUTH_WHITELIST_PATHS: /health,/docs,/openapi.json,/api/v1/admin/login,/api/v1/assessments,/api/v1/questionnaire,/api/v1/assessment-drafts
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: INFO
      ASSESSMENT_DOCUMENTS_DIR: ${ASSESSMENT_DOCUMENTS_DIR:-/var/lib/methodalign/documents}
      PARTICIPANT_COOKIE_SECURE: ${PARTICIPANT_COOKIE_SECURE:-false}
      DOCUMENT_ENCRYPTION_KEY_BASE64: ${DOCUMENT_ENCRYPTION_KEY_BASE64:?Set a 32-byte base64 document encryption key}
      DOCUMENT_ENCRYPTION_KEY_VERSION: ${DOCUMENT_ENCRYPTION_KEY_VERSION:-v1}
      GEMINI_GENERATION_MODEL: ${GEMINI_GENERATION_MODEL:-gemini-3.5-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      GEMINI_EMBEDDING_DIMENSIONS: ${GEMINI_EMBEDDING_DIMENSIONS:-768}
      PDF_MIN_EXTRACTED_CHARACTERS: ${PDF_MIN_EXTRACTED_CHARACTERS:-200}
    volumes:
      - assessment_documents:/var/lib/methodalign/documents
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - methodalign-network

  document-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: methodalign-document-worker
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: methodalign
      POSTGRES_DRIVER: psycopg
      ASSESSMENT_DOCUMENTS_DIR: ${ASSESSMENT_DOCUMENTS_DIR:-/var/lib/methodalign/documents}
      DOCUMENT_ENCRYPTION_KEY_BASE64: ${DOCUMENT_ENCRYPTION_KEY_BASE64:?Set a 32-byte base64 document encryption key}
      DOCUMENT_ENCRYPTION_KEY_VERSION: ${DOCUMENT_ENCRYPTION_KEY_VERSION:-v1}
      GEMINI_GENERATION_MODEL: ${GEMINI_GENERATION_MODEL:-gemini-3.5-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      GEMINI_EMBEDDING_DIMENSIONS: ${GEMINI_EMBEDDING_DIMENSIONS:-768}
      GEMINI_REQUEST_TIMEOUT_MS: ${GEMINI_REQUEST_TIMEOUT_MS:-90000}
      GEMINI_MIN_REQUEST_INTERVAL_SECONDS: ${GEMINI_MIN_REQUEST_INTERVAL_SECONDS:-8}
      DOCUMENT_WORKER_POLL_SECONDS: ${DOCUMENT_WORKER_POLL_SECONDS:-2}
      DOCUMENT_WORKER_RETRY_LIMIT: ${DOCUMENT_WORKER_RETRY_LIMIT:-3}
      PDF_MIN_EXTRACTED_CHARACTERS: ${PDF_MIN_EXTRACTED_CHARACTERS:-200}
    volumes:
      - assessment_documents:/var/lib/methodalign/documents
    entrypoint: ["python", "document_worker.py"]
    networks:
      - methodalign-network

  traditional-advisor-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: methodalign-traditional-advisor-worker
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: methodalign
      POSTGRES_DRIVER: psycopg
      DOCUMENT_ENCRYPTION_KEY_BASE64: ${DOCUMENT_ENCRYPTION_KEY_BASE64:?Set a 32-byte base64 document encryption key}
      GEMINI_GENERATION_MODEL: ${GEMINI_GENERATION_MODEL:-gemini-3.5-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      GEMINI_EMBEDDING_DIMENSIONS: ${GEMINI_EMBEDDING_DIMENSIONS:-768}
      GEMINI_MIN_REQUEST_INTERVAL_SECONDS: ${GEMINI_MIN_REQUEST_INTERVAL_SECONDS:-8}
      TRADITIONAL_ADVISOR_WORKER_POLL_SECONDS: ${TRADITIONAL_ADVISOR_WORKER_POLL_SECONDS:-2}
      TRADITIONAL_ADVISOR_RETRY_LIMIT: ${TRADITIONAL_ADVISOR_RETRY_LIMIT:-3}
    volumes:
      - assessment_documents:/var/lib/methodalign/documents
    entrypoint: ["python", "traditional_advisor_worker.py"]
    networks:
      - methodalign-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
        BACKEND_INTERNAL_URL: http://backend:8000
    container_name: methodalign-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - methodalign-network

volumes:
  postgres_data:
    driver: local
  assessment_documents:
    driver: local

networks:
  methodalign-network:
    driver: bridge
